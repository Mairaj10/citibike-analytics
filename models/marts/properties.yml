version: 2

models:
  - name: fct_citibike_trips
    description: >
      Cleaned Citi Bike trip fact model. One row represents one ride.

    columns:
      - name: ride_id
        description: Unique identifier for a Citi Bike ride.
        data_tests:
          - not_null
          - unique

      - name: ride_duration_minutes
        description: >
          Ride duration in minutes, calculated from the ride start and end timestamps.

  - name: dim_station
    description: >
      Citi Bike station dimension. One row represents one station,
      using its most recently observed station information.

    columns:
      - name: station_id
        description: Unique Citi Bike station identifier.
        data_tests:
          - not_null
          - unique

      - name: station_name
        description: Most recently observed name for the station.

      - name: latitude
        description: Most recently observed station latitude.

      - name: longitude
        description: Most recently observed station longitude.

      - name: last_observed_at
        description: Timestamp of the observation used to represent the station.

  - name: mart_station_hourly_demand
    description: >
      Business-facing hourly station demand model. One row represents
      one Citi Bike station during one specific hour.

    columns:
      - name: station_id
        description: Citi Bike station identifier.
        data_tests:
          - not_null

      - name: station_hour
        description: Specific hourly time bucket for station activity.
        data_tests:
          - not_null

      - name: station_name
        description: Most recently observed name for the station.

      - name: latitude
        description: Most recently observed station latitude.

      - name: longitude
        description: Most recently observed station longitude.

      - name: departures
        description: Number of rides starting at the station during the hour.

      - name: arrivals
        description: Number of rides ending at the station during the hour.

      - name: net_flow
        description: >
          Arrivals minus departures. Positive means net inbound movement
          and negative means net outbound movement.

      - name: total_activity
        description: Total arrivals plus departures during the hour.

      - name: flow_direction
        description: >
          Business-friendly classification of station flow as net_inbound,
          net_outbound, or balanced.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - net_inbound
                  - net_outbound
                  - balanced

  - name: mart_daily_rider_behavior
    description: >
      Daily Citi Bike rider behavior model. One row represents one
      calendar date and one rider type.

    columns:
      - name: ride_date
        description: Calendar date on which the ride started.
        data_tests:
          - not_null

      - name: rider_type
        description: Citi Bike rider classification as member or casual.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - member
                  - casual

      - name: median_ride_duration_minutes
        description: Median ride duration in minutes for the date and rider type.

      - name: total_rides
        description: Number of rides for the date and rider type.

  - name: mart_daily_rider_weather
    description: >
      Daily Citi Bike rider behavior enriched with Central Park NOAA
      weather observations. One row represents one calendar date
      and one rider type.

    columns:
      - name: ride_date
        description: Calendar date on which the rides started.
        data_tests:
          - not_null

      - name: rider_type
        description: Citi Bike rider classification as member or casual.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - member
                  - casual

      - name: total_rides
        description: Number of rides for the date and rider type.

      - name: median_ride_duration_minutes
        description: Median ride duration in minutes for the date and rider type.

      - name: precipitation_inches
        description: Daily precipitation in inches at the Central Park weather station.

      - name: snowfall_inches
        description: Daily snowfall in inches at the Central Park weather station.

      - name: max_temperature_f
        description: Daily maximum temperature in degrees Fahrenheit.

      - name: min_temperature_f
        description: Daily minimum temperature in degrees Fahrenheit.